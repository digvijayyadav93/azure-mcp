name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-azure.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-azure.txt
      - name: Compile Python
        run: python -m compileall -q app scripts function_app.py
      - name: Run tests
        run: python -m pytest -q
